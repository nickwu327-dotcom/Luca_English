<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>比奇堡居民的單字庫</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fa;--fg:#1f2937;--card:#fff;--navy:#1e3a5f;--navy2:#16304f;--teal:#0f8b8d;--teal2:#0b6f71;--bd:#dde3ec;--soft:#eef2f8;--ok:#13804a;--bad:#c0392b;--mut:#64748b}

:root[data-theme="dark"]{--bg:#0f1724;--fg:#e5eaf2;--card:#192234;--navy:#3d6aa8;--navy2:#2f5489;--teal:#2bb3b5;--teal2:#1f9c9e;--bd:#2c3a52;--soft:#222d44;--ok:#4cd68a;--bad:#ff8479;--mut:#93a3bb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.top{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;border-radius:12px;padding:18px 22px;margin:4px 0 14px;border-bottom:4px solid var(--teal)}
.brand{font-family:Georgia,"Noto Serif TC","Songti TC",serif;font-size:28px;font-weight:700;letter-spacing:1px}
.sub{font-size:12px;letter-spacing:3px;opacity:.8;margin-top:2px}
nav{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid var(--bd);overflow-x:auto}
nav button{flex:1;min-width:max-content;padding:11px 16px;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;background:transparent;color:var(--mut);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
nav button:hover{color:var(--fg)}
nav button.on{color:var(--navy);border-bottom-color:var(--teal)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.card>b,.card>div>b{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.weeks{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.weeks label{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 14px;cursor:pointer;user-select:none;font-weight:600;font-size:15px;color:var(--fg)}
.weeks label:hover{border-color:var(--teal)}
.weeks label.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.weeks label.on::before{content:"✓ "}
.weeks input{display:none}
button.b{padding:11px 22px;border:1px solid var(--navy);border-radius:8px;background:var(--navy);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin:4px 8px 4px 0;font-family:inherit;transition:background .15s}
button.b:hover{background:var(--navy2)}
button.b:active{transform:translateY(1px)}
button.b.g{background:var(--card);color:var(--fg);border:1px solid var(--bd);padding:8px 14px;font-size:15px;font-weight:500}
button.b.g:hover{border-color:var(--teal);color:var(--teal)}
#qstart{background:var(--teal);border-color:var(--teal);font-size:18px;padding:12px 28px}
#qstart:hover{background:var(--teal2)}
#qrestart{color:var(--bad);border-color:var(--bad)}
#qsub{font-size:18px;padding:12px 30px;background:var(--teal);border-color:var(--teal)}
input[type=text],input[type=date]{font-size:26px;padding:12px 14px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);width:100%;box-sizing:border-box;text-align:center;font-family:inherit;outline:none}
input[type=text]:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,139,141,.18)}
input[type=date]{font-size:15px;width:auto;padding:5px 10px;text-align:left;border-width:1px}
input[type=checkbox]{width:18px;height:18px;vertical-align:middle;accent-color:var(--teal)}
.big{text-align:center;margin:12px 0}
#qplay{font-size:20px;padding:13px 30px;border-radius:999px;background:var(--navy)}
.fb{text-align:center;font-size:20px;font-weight:700;min-height:30px;margin:12px 0;padding:10px;border-radius:10px}
.fb.ok{background:rgba(19,128,74,.1);border:1px solid var(--ok)}
.fb.bad{background:rgba(192,57,43,.08);border:1px solid var(--bad)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.hide{display:none!important}
.miss{color:var(--ok);font-weight:800;text-decoration:underline}.extra{color:var(--bad);text-decoration:line-through}
.fb div{margin:6px 0;font-size:24px;letter-spacing:.5px;font-weight:600;color:var(--fg)}
.fb .ph{font-size:18px;letter-spacing:0;color:var(--mut);font-weight:400;font-family:"Lucida Sans Unicode","Segoe UI",sans-serif}
.fb .muted{font-size:13px;letter-spacing:0;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:15.5px;margin-top:10px}
th{background:var(--soft);color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
th,td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left}
tr:hover td{background:var(--soft)}
.sc{overflow-x:auto}
.muted{color:var(--mut);font-size:14px}
h4{font-size:17px;color:var(--navy);border-left:4px solid var(--teal);padding-left:10px;margin:18px 0 6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}

.bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .3s}

</style></head><body><div class="wrap">
<nav id="nav"></nav>

<section id="s0"><div id="qmode" class="muted" style="margin:0 0 8px"></div><div class="card">
<b>選擇單字表</b><div class="weeks" id="qset"></div><b>選擇測驗週次</b> <span class="muted" id="cwq"></span>
<div class="weeks" id="qw"></div>
<button class="b g" id="qprev">勾選前週及當週</button><button class="b g" id="qall">全選</button><button class="b g" id="qnone">全不選</button>
<label style="display:block;margin:8px 0"><input type="checkbox" id="qwrong"> 錯題重複練習 <span class="muted">(從答錯的題目出題;沒有錯題則從所選週次隨機出題)</span></label>
<div style="display:flex;justify-content:space-between;gap:120px;align-items:center;margin-top:6px"><button class="b" id="qstart" style="margin:0">開始測驗</button><button class="b g" id="qrestart" style="margin:0">重新開始</button></div>
<div id="qmsg" class="bad" style="margin-top:8px"></div>
</div>
<div class="card hide" id="qbox">
<div class="muted" id="qnote"></div><div class="muted" id="qprog"></div><div class="bar"><i id="qbar" style="width:0"></i></div>
<div id="qdesc" class="hide"></div>
<div class="big"><button class="b" id="qplay">▶ 播放發音</button></div>
<input type="text" id="qin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="輸入英文單字後按 Enter">
<div class="fb" id="qfb"></div>
<div><button class="b" id="qsub">確認答案</button></div></div>
<div class="card hide" id="qend"><b id="qsum"></b><div style="margin-top:8px"><button class="b" id="qretry">錯題重複練習</button></div></div>
</section>

<section id="s1" class="hide"><div class="card"><b>選擇單字表</b><div class="weeks" id="sset"></div><b>選擇週次</b><div class="weeks" id="sw"></div>
<button class="b g" id="sall">全選</button><button class="b g" id="snone">全不選</button>
<div style="margin-top:8px" class="muted">測驗開始日期:<input type="date" id="d1"> ~ <input type="date" id="d2"></div></div>
<div class="card sc" id="sout"></div></section>

<section id="s2" class="hide"><div id="lout"></div></section>

<section id="s3" class="hide"><div class="card"><b>選擇單字表</b><div class="weeks" id="rset"></div><b>選擇週次</b> <span class="muted" id="cwr"></span><div class="weeks" id="rw"></div></div>
<div class="card" id="rout"></div></section>

<section id="s4" class="hide"><div class="card"><b>發音口音</b><div class="weeks" id="stlang"></div>
<b>發音聲音</b><div><select id="stvoice"></select></div>
<b>語速</b> <span class="muted">(1 最慢 ~ 5 最快,預設 2)</span><div class="weeks" id="strate"></div>
<button class="b" id="sttest">▶ 試聽</button><div class="muted" id="stnote" style="margin-top:6px"></div></div>
<div class="card sc"><b>本機可用的英文聲音</b><div class="muted" id="stallnote" style="margin:4px 0"></div><div id="stall"></div></div></section>
</div>

 $("qretry").classList.toggle("hide",!wrong.length);return}
 locked=false;$("qsub").textContent="確認答案";$("qin").value="";$("qin").disabled=false;$("qfb").textContent="";$("qfb").className="fb";
 const it=queue[idx];$("qprog").textContent=`第 ${idx+1} / ${queue.length} 題`+(it.w.includes("/")?"(此題有兩個形態,請用 / 分隔,如 a / b)":"");
 $("qbar").style.width=(idx/queue.length*100)+"%";$("qin").focus();cue(it)}
function submit(){if(locked){idx++;next();return}
 const it=queue[idx],ok=norm($("qin").value)===norm(it.w);
 T.log.push({w:it.w,g:it.g,ok});save();locked=true;$("qin").disabled=true;$("qsub").textContent="下一題 →";
 const [A,B]=diffHTML(it.w,$("qin").value),px=GM[it.g]&&GM[it.g].words.find(x=>x.w===it.w),P=px&&px.p?` <span class="ph">(${px.p})</span>`:"";
 if(ok){$("qfb").className="fb ok";$("qfb").innerHTML=`✓ 答對了 Correct<div>正確答案:<b>${A}</b>${P}</div>`}
 else{wrong.push(it);$("qfb").className="fb bad";$("qfb").innerHTML=`✗ 再試一次 Try again<div>你的答案:${B||"(空白)"}</div><div>正確答案:<b>${A}</b>${P}</div><div class="muted">綠色底線 = 漏掉或打錯的正確字母;紅色刪除線 = 多打或打錯的字母</div>`}}
function diffHTML(a,b){const x=norm(a),y=norm(b),n=x.length,m=y.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));
 const e=c=>c===" "?"&nbsp;":c.replace(/[&<>"]/g,k=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[k]));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=x[i]===y[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
 let i=0,j=0,A="",B="";
 while(i<n||j<m){if(i<n&&j<m&&x[i]===y[j]){A+=e(a[i]);B+=e(y[j]);i++;j++}
  else if(j>=m||(i<n&&d[i+1][j]>=d[i][j+1])){A+=`<u class="miss">${e(a[i])}</u>`;i++}
  else{B+=`<s class="extra">${e(y[j])}</s>`;j++}}
 return[A,B]}
$("qstart").onclick=begin;$("qsub").onclick=submit;
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("qbox").classList.contains("hide")){e.preventDefault();submit()}});
$("qplay").onclick=()=>{cue(queue[idx]);$("qin").focus()};
$("qretry").onclick=()=>round(shuffle(wrong));
$("qrestart").onclick=()=>{if(!T){msg("尚未開始測驗");return}try{speechSynthesis.cancel()}catch(e){}const ids=T.weeks;tests=tests.filter(t=>t!==T);qSet=T.set||qSet;launch(ids)};

// stats
let sSet="CET";const sSel=new Set(prevCur(sSet));
function sR(){setChips("sset",sSet,k=>{sSet=k;sSel.clear();prevCur(k).forEach(x=>sSel.add(x));sR();stats()});wkChips("sw",sSet,sSel,stats)}sR();
$("sall").onclick=()=>{G.filter(g=>g.set===sSet).forEach(g=>sSel.add(g.id));sR();stats()};$("snone").onclick=()=>{sSel.clear();sR();stats()};$("d1").onchange=stats;$("d2").onchange=stats;
function tbl(rows){return`<table><tr><th>單字</th><th>單字表/週</th><th>測驗次</th><th>答錯</th><th>答錯率</th></tr>`+rows.map(r=>`<tr><td>${r.w}</td><td>${gl(r.g)}</td><td>${r.n}</td><td>${r.x}</td><td>${Math.round(r.x/r.n*100)}%</td></tr>`).join("")+"</table>"}
const agg=log=>{const m={};log.forEach(l=>{const k=l.g+"|"+l.w,o=m[k]||(m[k]={w:l.w,g:l.g,n:0,x:0});o.n++;if(!l.ok)o.x++});return Object.values(m).sort((a,b)=>b.x/b.n-a.x/a.n||b.x-a.x)};
function stats(){const a=$("d1").value?new Date($("d1").value+"T00:00:00").getTime():0,b=$("d2").value?new Date($("d2").value+"T23:59:59").getTime():Infinity;
 if(!sSel.size){$("sout").innerHTML='<span class="muted">請選擇要查看的週次</span>';return}
 const log=tests.filter(t=>t.id>=a&&t.id<=b).flatMap(t=>t.log).filter(l=>sSel.has(l.g));
 $("sout").innerHTML=log.length?tbl(agg(log)):'<span class="muted">此條件下沒有測驗紀錄</span>'}

// status
function status(){const c=$("lout");if(!tests.length){c.innerHTML='<div class="card muted">尚無測驗紀錄</div>';return}
 c.innerHTML=tests.slice().sort((a,b)=>b.id-a.id).map(t=>{const x=t.log.filter(l=>!l.ok).length;
 return`<div class="card sc"><b>${fmt(t.id)}</b> <span class="muted">${t.mode==="desc"?"[Description] ":""}${t.weeks.map(gl).join("、")}|作答 ${t.log.length} 次,答錯 ${x} 次</span>`+(t.log.length?tbl(agg(t.log)):"")+"</div>"}).join("")}

// review
let rSet="CET";const rSel=new Set(prevCur(rSet));
function rRender(){setChips("rset",rSet,k=>{rSet=k;rSel.clear();prevCur(k).forEach(x=>rSel.add(x));rRender()});wkChips("rw",rSet,rSel,review);review()}
$("cwr").textContent="(目前第 "+CUR+" 週,已自動勾選前週及當週)";
function review(){const ids=order(rSel);
 $("rout").innerHTML=ids.length?ids.map(id=>`<h4 style="margin:10px 0 0">${GM[id].label}</h4>`+GM[id].words.map((x,i)=>`<div class="row"><span class="w">${x.w}</span><span class="p">${x.p?"/"+x.p+"/":""}</span><button class="b g" data-s="${id}|${i}">🔊</button><div class="zhx">${zh(x.w)}</div></div>`).join("")).join(""):'<span class="muted">請選擇週次</span>'}
$("rout").onclick=e=>{const s=e.target.dataset&&e.target.dataset.s;if(s){const[g,i]=s.split("|");speak(GM[g].words[i].w)}};
function stRender(){chips("stlang",LANGS,k=>k===ST.lang,k=>{ST.lang=k;ST.voice="";saveST();stRender()});
 chips("strate",[1,2,3,4,5].map(n=>[n,String(n)]),k=>k===(+ST.lv||2),k=>{ST.lv=k;saveST();stRender()});
 const vs=getVoices().filter(x=>nl(x)===ST.lang),sel=$("stvoice");
 sel.innerHTML='<option value="">自動(系統預設)</option>'+vs.map(v=>`<option value="${v.voiceURI.replace(/"/g,"&quot;")}">${v.name}</option>`).join("");sel.value=ST.voice;
 const all=getVoices(),en=all.filter(x=>nl(x).toLowerCase().startsWith("en")).sort((a,b)=>nl(a).localeCompare(nl(b))||a.name.localeCompare(b.name));
 $("stallnote").textContent=`本機共 ${all.length} 個聲音,其中英文 ${en.length} 個。目前網站可選口音:美式、英式、澳洲、加拿大。`;
 $("stall").innerHTML=en.length?`<table><tr><th>口音(語言代碼)</th><th>聲音名稱</th><th>類型</th></tr>`+en.map(v=>`<tr><td>${nl(v)}</td><td>${v.name}</td><td>${v.localService?"本機":"線上"}</td></tr>`).join("")+"</table>":'<span class="muted">沒有偵測到英文聲音(部分瀏覽器需要稍等幾秒載入,請重新進入設定頁)</span>';
 $("stnote").textContent=vs.length?`此裝置有 ${vs.length} 個「${LANGS.find(x=>x[0]===ST.lang)[1]}」聲音可選`:"此裝置沒有這個口音的專用聲音,會改用系統預設英語聲音(可能聽不出差異)"}
$("stvoice").onchange=e=>{ST.voice=e.target.value;saveST()};
$("sttest").onclick=()=>speak("Hello! Apple, banana, neighbor, vocabulary.");
try{speechSynthesis.onvoiceschanged=()=>{if(!$("s4").classList.contains("hide"))stRender()}}catch(e){}
rRender();show(0);
</script></body></html>
